# Publications
# ------------
# This file is the single source for the Publications page and the
# "Selected publications" list on the home page.
#
# To add a paper: copy an entry, paste it at the top of its group,
# and edit the fields. Entries appear in the order they are listed here.
#
# Fields
#   type:      article | preprint | chapter | book
#   authors:   as you want them printed; "Finnerty, S." is shown in bold
#   year:      publication year
#   title:     article title
#   venue:     journal, publisher, or preprint server
#   details:   volume, issue, article number, pages (optional)
#   doi:       DOI without the https://doi.org/ prefix (optional)
#   url:       use instead of doi if there is no DOI (optional)
#   featured:  true to show under "Selected publications" on the home page (keep to 3 or 4)
#   note:      short note shown after the citation, e.g. "Open access" (optional)

