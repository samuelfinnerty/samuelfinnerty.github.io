project:
  type: website
  output-dir: _site
  resources:
    - cv/*.pdf
    - assets/favicon.svg
    - assets/fonts/*.woff2
  render:
    - "*.qmd"

website:
  title: "Samuel Finnerty"
  description: "Social and environmental psychologist at Lancaster University, researching scientists' climate advocacy and activism, public responses to climate protest, and universities' climate responses."
  # When the custom domain is live, change this to it (e.g. https://samuelfinnerty.com)
  site-url: https://samuelfinnerty.github.io
  favicon: assets/favicon.svg
  image: assets/images/sam-finnerty.jpg
  open-graph: true
  search: false
  twitter-card: true
  navbar:
    title: "Samuel Finnerty"
    right:
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks & media
      - href: writing.qmd
        text: Writing
      - href: teaching.qmd
        text: Teaching
      - href: approach.qmd
        text: Approach
      - href: cv/Samuel-Finnerty-CV.pdf
        text: CV
  page-footer:
    left: "© 2026 Samuel Finnerty"
    right: "The stripes show global surface temperature, 1880–2025 (NASA GISTEMP)."

format:
  html:
    theme:
      light: [_theme/light.scss, _theme/rules.scss]
      dark: [_theme/dark.scss, _theme/rules.scss]
    respect-user-color-scheme: true
    css:
      - assets/fonts/fonts.css
      - _theme/stripes.css
    include-before-body: _partials/stripes-rule.html
    lightbox: true
    html-math-method: plain
    toc: false
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: false

editor: visual
