# Checks every link on the site once a month and after each publish.
# Broken links are listed in the run summary (Actions tab > Check links).
# A failed check does not take the site down; it is a report only.

name: Check links

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_run:
    workflows: ["Publish site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429,999
            --exclude-path _site/site_libs
            --exclude linkedin.com
            --root-dir ${{ github.workspace }}/_site
            '_site/**/*.html'
          fail: true
